<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Options Menu Simulator</title>
<style>
  :root { --bg: #111; --fg: #ddd; --muted: #888; --panel: #1b1b1b; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif;
         display: flex; gap: 16px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
  #view { flex: 1; display: flex; align-items: flex-start; justify-content: center; min-width: 0; }
  canvas { width: 100%; max-width: calc((100vh - 32px) * 4 / 3); aspect-ratio: 4 / 3; background: #000; }
  aside { width: 260px; flex: none; background: var(--panel); padding: 12px; border-radius: 6px; }
  aside h1 { font-size: 15px; margin: 0 0 8px; }
  aside pre { white-space: pre-wrap; font-size: 12px; color: var(--fg); }
  aside p, aside label { color: var(--muted); font-size: 12px; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; color: var(--fg); }
  @media (max-width: 700px) { body { flex-direction: column; } aside { width: auto; } }
</style>
</head>
<body>
<div id="view"><canvas id="screen" width="640" height="480"></canvas></div>
<aside>
  <h1>Options menu simulator</h1>
  <p><kbd>Arrows</kbd> move, <kbd>Enter</kbd>/<kbd>Z</kbd> select, <kbd>Esc</kbd>/<kbd>X</kbd> back, <kbd>C</kbd> = Y (exit, as on the GameCube). A gamepad also works.</p>
  <label>Language <select id="lang"></select></label><br>
  <label><input type="checkbox" id="extras"> PC settings (options.js extraCategories)</label><br>
  <button id="replay">Replay open</button>
  <pre id="settings"></pre>
  <p>Layout, motions, textures, glyphs and strings come from the disc (build_sim_data.py). Menu content is in options.js.</p>
</aside>
<script src="generated/data.js"></script>
<script src="pc_strings.js"></script>
<script src="options.js"></script>
<script src="sim.js"></script>
</body>
</html>
